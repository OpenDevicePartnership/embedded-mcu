[package]
name = "embedded-mcu-hal"
description = "Traits used by Open Device Partnership's Embedded Controller project"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[package.metadata.docs.rs]
features = ["chrono", "defmt"]

[dependencies]
chrono = { version = "^0.4", default-features = false, optional = true }
defmt = { version = "1.0", optional = true }
embedded-hal = { workspace = true }
num_enum = { version = "0.7.5", default-features = false }
embedded-hal-async = "1.0.0"

[dev-dependencies]
proptest = "1.0.0"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[features]
default = []

chrono = ["dep:chrono"]
defmt = ["dep:defmt", "embedded-hal-async/defmt-03"]

[lints]
workspace = true
